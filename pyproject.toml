[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-executive-assistant"
version = "0.1.0"
description = "Core functionality for AI Executive Assistant"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "AI Assistant"}
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0"
]
graph = [
  "msal>=1.26.0",
  "requests>=2.31.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
